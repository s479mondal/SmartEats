server:
  port: 8083

spring:
  application:
    name: order-service
  data:
    mongodb:
      auto-index-creation: true
      uri: ${MONGODB_URI_ORDER}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

kafka:
  topic:
    order-created: smarteats.order.created
    order-status: smarteats.order.status
    order-accepted: smarteats.order.accepted
    order-ready: smarteats.order.ready
    order-delivered: smarteats.order.delivered

services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  restaurant-service:
    url: ${RESTAURANT_SERVICE_URL:http://localhost:8082}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_SZ9vgZQjij4g7j}
  key-secret: ${RAZORPAY_KEY_SECRET:eU3taZ4ADVpI3HT3sfnjRfvf}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:smarteats_test_webhook_secret}

payment:
  pending-expiry-minutes: ${PAYMENT_PENDING_EXPIRY_MINUTES:15}
  pending-expiry-check-ms: ${PAYMENT_PENDING_EXPIRY_CHECK_MS:60000}


