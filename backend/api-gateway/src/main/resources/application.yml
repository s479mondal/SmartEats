server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        # Auth Service Route (unsecured)
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        # Admin Service Route
        - id: admin-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/admin/**

        # Restaurant Service Route (secured via filter)
        - id: restaurant-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/restaurants/**

        # Order Service Route (secured via filter)
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**

        # Delivery Service Route (secured via filter)
        - id: delivery-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/deliveries/**

# JWT secret for token validation at the gateway level (must match auth-service)
jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLXNtYXJ0ZWF0cy1iYWNrZW5kLXByb2plY3QtbWNhLWRpc3NlcnRhdGlvbg==}
