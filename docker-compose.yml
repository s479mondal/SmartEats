version: '3.8'

services:
  # Primary Database
  mongodb:
    image: mongo:latest
    container_name: smarteats-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - smarteats-network
    restart: always

  # MongoDB GUI Client
  mongo-express:
    image: mongo-express:latest
    container_name: smarteats-mongo-express
    depends_on:
      - mongodb
    ports:
      - "8088:8081" # Exposed on 8088 to prevent port conflict with auth-service (8081)
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
    networks:
      - smarteats-network
    restart: always

  # In-Memory Cache & Cart Store
  redis:
    image: redis:alpine
    container_name: smarteats-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - smarteats-network
    restart: always

  # Distributed Event Streaming Platform
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: smarteats-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - smarteats-network
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: smarteats-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - smarteats-network
    restart: always

volumes:
  mongo-data:
  redis-data:

networks:
  smarteats-network:
    driver: bridge
